# ---- TEST DATABASE ----
# Tests run against H2 in memory, not SQL Server.
#
# WHY NOT THE REAL DATABASE
# A test suite that needs a SQL Server instance running is a suite people stop
# running. H2 starts with the JVM, is destroyed with it, and gives every test
# class a clean schema, so tests cannot pass or fail depending on what a previous
# run left behind.
#
# WHAT THIS TRADES AWAY - AND IT IS A REAL TRADE
# The Flyway migrations are SQL Server dialect (IDENTITY, NVARCHAR, GO batches),
# so they cannot run here. That means these tests verify the ENTITIES and the
# BUSINESS RULES, but they do NOT verify the migrations themselves. A mistake in
# a migration would still reach SQL Server undetected by this suite.
#
# The mitigation is that ddl-auto=validate on the real database refuses to start
# if the migrations and the entities have drifted apart - so a divergence fails
# loudly at startup rather than silently at runtime.
spring.datasource.url=jdbc:h2:mem:trackertest;DB_CLOSE_DELAY=-1;MODE=LEGACY
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate builds the schema from the entities here, since Flyway is off.
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

spring.jpa.open-in-view=false

# The CORS allow-list still has to resolve, or the context will not start.
app.cors.allowed-origins=http://localhost:4200
