# ============================================================================
#  PRODUCTION PROFILE  -  activate with  --spring.profiles.active=prod
# ============================================================================
# Every property here either TIGHTENS something application.properties leaves
# open for development, or REMOVES a default so that a missing value stops the
# application instead of quietly running on a development one.
#
# The second half of that is the point. A deployment that forgets DB_PASSWORD
# must not start successfully against whatever the development default happened
# to be. Every placeholder below is deliberately written WITHOUT a ":default"
# suffix for exactly that reason - do not add one.
#
# That alone makes the deployment FAIL, but not all of it fails CLEARLY: Boot's
# Binder leaves an unresolved ${...} in a spring.datasource.* value as literal
# text rather than throwing, so the symptom is a driver or login error pointing
# at the database. ProductionConfigCheck exists to say which variables are
# actually missing, all of them in one message. It runs as an
# EnvironmentPostProcessor - before component scanning and before any
# @ConditionalOnProperty is evaluated - so nothing else can fail for the same
# reason first. Add any new bare placeholder to its REQUIRED list in the same
# change; ProductionProfileTest fails the build if you forget.
#
# The seed accounts (admin/teacher/student, all "password123") are NOT disabled
# here, because a properties file cannot disable a bean. They are gated in Java
# by @Profile("!prod") on the runners in TrackerApplication - see the long
# comment there for why it is an exclusion rather than @Profile("dev").
#
# STILL OPEN, and not fixed by this file - a deployment needs to deal with each
# separately:
#   - ck_person_profile_omang_format is still is_not_trusted = 1 (V13), so six
#     grandfathered profiles predate the Omang rule.
#   - There is no backup or restore procedure written down anywhere.
#   - The privacy policy and terms still carry bracketed placeholders for the
#     operating school to complete, and say so in their own text.

# ---- DATABASE ----
# No defaults. All three must come from the environment.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ---- SCHEMA ----
# baseline-on-migrate is ON in development because that database predates
# Flyway. It is OFF here on purpose: it means "if you find a non-empty schema
# with no history table, adopt it and skip everything up to the baseline",
# which against a production database is a silent way to never run a migration
# that was supposed to run. Failing to start is the correct answer to a schema
# that is not what Flyway expects.
spring.flyway.baseline-on-migrate=false
spring.flyway.enabled=true
# validate is inherited from application.properties and must stay validate.
# Hibernate is never allowed to change a production schema.

# ---- API DOCUMENTATION ----
# Off. These paths are permitAll while every other route requires a session,
# so leaving them on publishes an unauthenticated, machine-readable listing of
# the entire API surface. SecurityConfig does not merely block them when this
# is false - it never adds the permitAll rule at all.
app.openapi.enabled=false

# ---- CROSS-ORIGIN (CORS) ----
# No default, so a deployment must name its own front end. Never "*": this API
# authenticates with cookies, and a wildcard origin would let any site on the
# internet call it as a signed-in visitor.
#   APP_CORS_ALLOWED_ORIGINS=https://tracker.example.com
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

# ---- COOKIES ----
# Read by SecurityConfig for the XSRF-TOKEN cookie, and reused below for the
# session cookie so the two can never drift apart.
#
# Secure means the browser will not send these over plain http AT ALL, so this
# line is also the assertion that the deployment terminates TLS. If it does
# not, sign-in will appear to succeed and every subsequent request will be
# unauthenticated.
app.cookies.secure=true
#
# Lax assumes the browser reaches the front end and this API on the same
# registrable domain. If they are genuinely cross-site, set this to None -
# which browsers only honour together with Secure, already true above.
app.cookies.same-site=Lax

server.servlet.session.cookie.secure=${app.cookies.secure}
server.servlet.session.cookie.same-site=${app.cookies.same-site}
# The session cookie, unlike XSRF-TOKEN, is never read by script and says so.
server.servlet.session.cookie.http-only=true

# ---- PROXY ----
# Behind a load balancer or reverse proxy, the request Tomcat sees is plain
# http from the proxy. Without this, request.isSecure() is false, generated
# URLs say http, and Spring Security's own "is this connection secure" default
# is wrong. framework tells Boot to honour the X-Forwarded-* headers the proxy
# sets - only correct when a trusted proxy is actually in front, which is why
# it is here rather than in the shared file.
server.forward-headers-strategy=framework

# ---- ERROR RESPONSES ----
# These govern Spring Boot's DEFAULT error page only. They are not what keeps
# driver text out of API responses - GlobalExceptionHandler builds every error
# body this application returns, and deliberately never echoes constraint or
# stack-trace detail to the client. This is the backstop for anything that
# reaches /error without passing through it.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

# ---- LOGGING ----
# Do not log SQL or bind parameters in production: bind parameters include
# Omang numbers, contact emails and dates of birth, and a log is a far easier
# thing to read than the database it describes.
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN

# ---- MAIL ----
# REQUIRED, and this is the item that matters most in this file.
#
# ResetLinkMailer sends a real email when spring.mail.host is set, and WRITES
# THE RESET LINK TO THE LOG when it is not. That fallback is a development
# convenience which announces itself on every send, and it is exactly right
# for development - but in production it means anybody who can read the
# application log can take over any account by following a link they find
# there. The fallback never throws, so nothing else would have gone wrong to
# make it noticeable.
#
# Demanding MAIL_HOST here is what turns that from a quiet condition into a
# refusal to start. If a deployment genuinely has no mail server, the honest
# response is to take the forgot-password route out of SecurityConfig, not to
# let the links go to the log.
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
# STARTTLS on, because the message being sent IS a credential - a link that
# sets a password. Sending it over an unencrypted hop would undo the care
# taken to store the token only as a SHA-256 hash.
spring.mail.properties.mail.smtp.starttls.enable=true
# Set MAIL_AUTH=false for an internal relay that accepts unauthenticated mail.
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:true}

# Where the link in that email points. REQUIRED for the same reason: the
# default in ResetLinkMailer is http://localhost:4200/reset-password, so a
# deployment that forgets this sends out reset emails that work only on the
# server they were sent from. Include the path, no trailing slash:
#   RESET_LINK_BASE=https://tracker.example.com/reset-password
app.reset-link-base=${RESET_LINK_BASE}

# ---- FIRST ADMINISTRATOR ----
# OPTIONAL, and deliberately given an empty default so it is NOT in
# ProductionConfigCheck.REQUIRED: it is needed for the first start against an
# empty database and must be removed afterwards. See FirstAdminBootstrap - it
# creates the account "admin" only while no administrator exists, forces a
# password change at first sign-in, and does nothing at all once an admin
# exists.
app.bootstrap-admin-password=${APP_BOOTSTRAP_ADMIN_PASSWORD:}
