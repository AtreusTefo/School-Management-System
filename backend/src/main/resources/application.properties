# ---- DATABASE: SQL Server 2019 (MSSQLSERVER01) ----
# The application database is now persistent. It was H2 in-memory, which meant
# every restart wiped the data - the limitation that blocked accounts, due dates
# and edit history from meaning anything.
#
# MSSQLSERVER01 is a NAMED instance. Two facts about it are worth knowing:
#   - Only Shared Memory was enabled by default. JDBC cannot use shared memory,
#     so TCP had to be switched on before Java could connect at all.
#   - Named instances use dynamic ports, which change on every restart. The port
#     below is pinned static (14333) so this URL keeps working. Without pinning,
#     the SQL Browser service would have to be running to locate the instance.
#
# encrypt/trustServerCertificate: the driver encrypts by default and would
# otherwise reject the instance's self-signed development certificate. Trusting
# it is acceptable on localhost and NOT acceptable anywhere else.
spring.datasource.url=jdbc:sqlserver://localhost:14333;databaseName=School Management System;encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USERNAME:tracker_app}
spring.datasource.password=${DB_PASSWORD:Tracker!2026Dev}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Credentials are overridable by environment variable so the same jar runs
# against another database without a rebuild:
#   DB_USERNAME=... DB_PASSWORD=... java -jar tracker.jar
# The defaults above are a LOCAL DEVELOPMENT login scoped to this one database.

# ---- SCHEMA ----
# validate, never create or update. Hibernate checks that the tables match the
# entities and refuses to start if they do not; it is not allowed to change the
# schema itself. Every structural change goes through a Flyway migration in
# src/main/resources/db/migration, so the schema has a version and a history
# rather than being whatever the ORM inferred last time it started.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ---- TRANSACTIONS ----
# Close the persistence context when the service method returns, instead of
# holding it open through view rendering. Leaving this on keeps a database
# connection checked out for the whole request and lets queries fire late, from
# outside any transaction the service defined.
spring.jpa.open-in-view=false

# ---- CROSS-ORIGIN (CORS) ----
# Which origins may call this API from a browser. Comma-separated.
#
# These are DEVELOPMENT defaults. The value is read by CorsConfig rather than
# being compiled into the controller, so the same jar runs anywhere:
#
#   java -jar tracker.jar --app.cors.allowed-origins=https://tracker.example.com
#   APP_CORS_ALLOWED_ORIGINS=https://tracker.example.com java -jar tracker.jar
#
# Both loopback spellings are listed because "localhost" and "127.0.0.1" are the
# same machine but NOT the same origin - a page served from one was refused
# while the identical page from the other worked.
#
# Never set this to "*". That would let any site on the internet call this API
# from a visitor's browser.
app.cors.allowed-origins=http://localhost:4200,http://127.0.0.1:4200

# ---- API DOCUMENTATION (US-27) ----
# Serves the OpenAPI description at /v3/api-docs and an interactive UI at
# /swagger-ui.html.
#
# TRUE HERE BECAUSE THIS FILE IS THE DEVELOPMENT CONFIGURATION. The default in
# code is FALSE (see SecurityConfig.openApiEnabled), so an environment that does
# not set it gets no documentation endpoints at all - it fails closed.
#
# Turn it off for a real deployment:
#   java -jar tracker.jar --app.openapi.enabled=false
#
# The reason it is a switch rather than always-on: these paths are permitAll,
# while every other route in the application requires a session. An
# unauthenticated, machine-readable listing of every endpoint is a convenience
# while building and a gift to anybody probing a deployed system.
app.openapi.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# Group the endpoints in the order a person would meet them, rather than
# alphabetically, so the UI reads as a walkthrough: sign in first, then work.
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operationsSorter=method
