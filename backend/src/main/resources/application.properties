# ---- H2 IN-MEMORY DATABASE ----
# "in-memory" means the database lives in RAM and is wiped when the app stops.
# Perfect for a learning prototype: zero installation, fresh data every run.
spring.datasource.url=jdbc:h2:mem:trackerdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ---- SCHEMA ----
# Build the tables from our @Entity classes on startup and drop them on shutdown.
#
# This was "update", which only ever ADDS things — it will not tighten a column
# that already exists. A constraint added to an entity could therefore be missing
# from the running schema, leaving the database more permissive than the code
# believes. Since this database is in-memory and rebuilt every run anyway,
# create-drop guarantees the schema always matches the entities exactly.
#
# On a real, persistent database use "validate" here and manage schema changes
# with migrations (Flyway or Liquibase), so nothing alters the data silently.
spring.jpa.hibernate.ddl-auto=create-drop

# Fail fast if an entity is ever written that the schema cannot satisfy.
spring.jpa.properties.jakarta.persistence.validation.mode=auto

# ---- TRANSACTIONS ----
# Close the persistence context when the service method returns, instead of
# holding it open through view rendering. Leaving this on keeps a database
# connection checked out for the whole request and lets queries fire late, from
# outside any transaction the service defined. Off means every database access
# happens inside a boundary the service declared on purpose.
spring.jpa.open-in-view=false

# ---- H2 WEB CONSOLE (optional but great for learning) ----
# Once the app is running, open http://localhost:8080/h2-console in a browser
# to see the actual table and rows. Use JDBC URL: jdbc:h2:mem:trackerdb
spring.h2.console.enabled=true
