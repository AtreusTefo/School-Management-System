<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <marker id="arrowNavy2" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#253449"/>
    </marker>
    <clipPath id="cardClip2">
      <rect x="700" y="330" width="410" height="330" rx="18"/>
    </clipPath>
  </defs>

  <!-- right half: clear, current color -->
  <rect width="1200" height="900" fill="#F1ECE1"/>
  <!-- left half: muted, faded -->
  <rect width="600" height="900" fill="#E2DCC9"/>

  <g stroke="#C9C1AA" stroke-width="1" opacity="0.4">
    <line x1="0" y1="80" x2="600" y2="80"/>
    <line x1="0" y1="160" x2="600" y2="160"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="320" x2="600" y2="320"/>
    <line x1="0" y1="400" x2="600" y2="400"/>
    <line x1="0" y1="480" x2="600" y2="480"/>
    <line x1="0" y1="560" x2="600" y2="560"/>
    <line x1="0" y1="640" x2="600" y2="640"/>
    <line x1="0" y1="720" x2="600" y2="720"/>
    <line x1="0" y1="800" x2="600" y2="800"/>
  </g>

  <!-- LEFT: the scattered, informal way -->
  <!-- someone asking around -->
  <g transform="translate(175,190)">
    <rect x="-95" y="-58" width="190" height="108" rx="20" fill="#FFFFFF" stroke="#4A4640" stroke-width="2.5"/>
    <path d="M-30 50 L-48 84 L2 50 Z" fill="#FFFFFF" stroke="#4A4640" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="0" y="16" font-size="52" fill="#7A756B" text-anchor="middle" font-weight="700">?</text>
  </g>

  <!-- a crumpled paper note -->
  <g transform="translate(175,530) rotate(-8)">
    <path d="M-72 -52 L64 -60 L72 46 L38 64 L-16 40 L-64 52 Z" fill="#FFFFFF" stroke="#4A4640" stroke-width="2.5" stroke-linejoin="round"/>
    <line x1="-40" y1="-18" x2="34" y2="-22" stroke="#7A756B" stroke-width="3" stroke-linecap="round"/>
    <line x1="-40" y1="2" x2="20" y2="0" stroke="#7A756B" stroke-width="3" stroke-linecap="round"/>
    <line x1="-38" y1="0" x2="24" y2="0" stroke="#A8493E" stroke-width="2.5" stroke-linecap="round" opacity="0.6" transform="translate(0,2) rotate(3)"/>
    <line x1="-40" y1="22" x2="10" y2="20" stroke="#7A756B" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- a messy, half-filled spreadsheet -->
  <g transform="translate(430,370) rotate(7)">
    <rect x="-95" y="-70" width="190" height="140" fill="#FFFFFF" stroke="#4A4640" stroke-width="2.5"/>
    <line x1="-95" y1="-23" x2="95" y2="-23" stroke="#B8B2A0" stroke-width="2"/>
    <line x1="-95" y1="24" x2="95" y2="24" stroke="#B8B2A0" stroke-width="2"/>
    <line x1="-32" y1="-70" x2="-32" y2="70" stroke="#B8B2A0" stroke-width="2"/>
    <line x1="30" y1="-70" x2="30" y2="70" stroke="#B8B2A0" stroke-width="2"/>
    <rect x="-32" y="-23" width="62" height="47" fill="#D8D2BF"/>
    <path d="M-14 0 L-4 10 L18 -14" fill="none" stroke="#4A4640" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>
    <path d="M45 -55 L65 -35 M65 -55 L45 -35" stroke="#A8493E" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- a disconnected, tangled trail between them -->
  <path d="M120 250 Q 60 330 145 400 Q 220 460 175 470" fill="none" stroke="#7A756B" stroke-width="2" stroke-dasharray="1 8" stroke-linecap="round" opacity="0.5"/>
  <path d="M260 220 Q 360 260 350 320" fill="none" stroke="#7A756B" stroke-width="2" stroke-dasharray="1 8" stroke-linecap="round" opacity="0.5"/>

  <!-- transition line: dashed and scattered on the left, resolving to solid on the right -->
  <path d="M300 760 Q 460 700 600 660 Q 740 620 900 605" fill="none" stroke="#2F6E62" stroke-width="3" stroke-linecap="round"
        stroke-dasharray="1 10"/>
  <path d="M600 660 Q 740 620 900 605" fill="none" stroke="#2F6E62" stroke-width="3" stroke-linecap="round"/>

  <!-- the signature: a stamp of resolution, astride the divide -->
  <g transform="translate(600,450) rotate(-6)">
    <circle r="72" fill="#2F6E62" opacity="0.1"/>
    <circle r="72" fill="none" stroke="#2F6E62" stroke-width="5"/>
    <circle r="60" fill="none" stroke="#2F6E62" stroke-width="1.5" stroke-dasharray="2 6" opacity="0.6"/>
    <path d="M-28 2 L-8 24 L34 -22" fill="none" stroke="#2F6E62" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <line x1="600" y1="60" x2="600" y2="840" stroke="#4A4640" stroke-width="1.5" stroke-dasharray="2 10" opacity="0.25"/>

  <!-- RIGHT: one shared, current list -->
  <rect x="716" y="346" width="410" height="330" rx="18" fill="#253449" opacity="0.08"/>
  <g clip-path="url(#cardClip2)">
    <rect x="700" y="330" width="410" height="330" fill="#FAF7F0"/>
    <rect x="700" y="330" width="410" height="60" fill="#253449"/>
    <g transform="translate(724,349)">
      <rect x="0" y="0" width="17" height="17" rx="3" fill="none" stroke="#F1ECE1" stroke-width="2.2"/>
      <path d="M3 8 L7 12 L14 4" fill="none" stroke="#F1ECE1" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="754" y="368" fill="#F1ECE1" font-size="17" font-weight="600">Assignments</text>

    <g stroke="#E4DCC9" stroke-width="1">
      <line x1="700" y1="480" x2="1110" y2="480"/>
      <line x1="700" y1="570" x2="1110" y2="570"/>
    </g>

    <rect x="726" y="410" width="150" height="9" rx="4" fill="#4A4640" opacity="0.55"/>
    <rect x="726" y="424" width="100" height="7" rx="3" fill="#4A4640" opacity="0.3"/>
    <g transform="translate(1078,420) rotate(-8)">
      <circle r="22" fill="#2F6E62" opacity="0.09"/>
      <circle r="22" fill="none" stroke="#2F6E62" stroke-width="2.5"/>
      <path d="M-9 1 L-2 7 L11 -7" fill="none" stroke="#2F6E62" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <rect x="726" y="500" width="130" height="9" rx="4" fill="#4A4640" opacity="0.55"/>
    <rect x="726" y="514" width="110" height="7" rx="3" fill="#4A4640" opacity="0.3"/>
    <g transform="translate(1078,510) rotate(5)">
      <circle r="22" fill="#C97A2B" opacity="0.07"/>
      <circle r="22" fill="none" stroke="#C97A2B" stroke-width="2.5" stroke-dasharray="3 4"/>
      <circle r="2.4" fill="#C97A2B"/>
      <line x1="0" y1="0" x2="0" y2="-11" stroke="#C97A2B" stroke-width="2" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="7" y2="3" stroke="#C97A2B" stroke-width="2" stroke-linecap="round"/>
    </g>

    <rect x="726" y="590" width="165" height="9" rx="4" fill="#4A4640" opacity="0.55"/>
    <rect x="726" y="604" width="90" height="7" rx="3" fill="#4A4640" opacity="0.3"/>
    <g transform="translate(1078,600) rotate(6)">
      <circle r="22" fill="#2F6E62" opacity="0.09"/>
      <circle r="22" fill="none" stroke="#2F6E62" stroke-width="2.5"/>
      <path d="M-9 1 L-2 7 L11 -7" fill="none" stroke="#2F6E62" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
  <rect x="700" y="330" width="410" height="330" rx="18" fill="none" stroke="#253449" stroke-width="2"/>

  <!-- teacher and student, together, referencing the same list -->
  <g transform="translate(830,780) scale(0.72)">
    <circle cx="0" cy="-72" r="27" fill="#253449"/>
    <path d="M-40 42 Q-40 -22 0 -24 Q40 -22 40 42 Z" fill="#253449"/>
  </g>
  <g transform="translate(940,790) scale(0.62)">
    <circle cx="0" cy="-72" r="26" fill="#2F6E62"/>
    <path d="M-36 40 Q-36 -20 0 -22 Q36 -20 36 40 Z" fill="#2F6E62"/>
  </g>
  <path d="M868 748 Q 900 700 900 664" fill="none" stroke="#253449" stroke-width="2" stroke-dasharray="1 8" stroke-linecap="round" opacity="0.7" marker-end="url(#arrowNavy2)"/>
</svg>
