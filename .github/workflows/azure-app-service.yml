# Package the whole application as ONE jar and deploy it to Azure App Service.
#
# The production Angular build calls the API with relative URLs (environment.ts
# sets apiBaseUrl to ''), so it expects to be served from the same origin as the
# API. This workflow builds the frontend, copies it into the backend's
# classpath:/static, and packages the jar - SpaWebConfig then serves the pages
# and answers deep links with index.html. One origin means no CORS for the site
# at all and no second host to keep in step.
#
# Setup steps, including the environment variables the "prod" profile requires,
# are in docs/guides/DEPLOYMENT_AZURE.md. Until the repository variable
# AZURE_WEBAPP_NAME is set, only the package job runs.
#
# The test suite runs here as well as in build.yml, deliberately. The two
# workflows start independently on the same push, so without it a commit whose
# tests fail could still reach the live site while build.yml was going red.

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Build frontend, test and package jar
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/tracker-ui/package-lock.json

      - name: Build the Angular site
        working-directory: frontend/tracker-ui
        run: |
          npm ci
          npm run build

      # Copied, not committed: backend/src/main/resources/static/ is in
      # .gitignore. The test -f fails the job if the build ever moves its
      # output, rather than shipping a jar with no site in it.
      - name: Copy the site into the jar's static resources
        run: |
          mkdir -p backend/src/main/resources/static
          cp -r frontend/tracker-ui/dist/tracker-ui/browser/. backend/src/main/resources/static/
          test -f backend/src/main/resources/static/index.html

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Test and package
        working-directory: backend
        run: ./mvnw --batch-mode --no-transfer-progress package

      - name: Upload the jar
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: backend/target/tracker-0.0.1-SNAPSHOT.jar
          retention-days: 7

  deploy:
    name: Deploy to Azure App Service
    needs: package
    if: vars.AZURE_WEBAPP_NAME != ''
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.webapp-url }}

    steps:
      - name: Download the jar
        uses: actions/download-artifact@v4
        with:
          name: app

      # On a Java SE app the action deploys the jar as app.jar, which is what
      # App Service runs. The publish profile needs SCM Basic Auth Publishing
      # Credentials switched on in the Web App's configuration.
      - name: Deploy
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: tracker-0.0.1-SNAPSHOT.jar
