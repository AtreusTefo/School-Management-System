# US-29: run the verification suite on every push.
#
# Until this existed, every guarantee in the project depended on somebody
# remembering to run `mvnw test` before pushing. The suite was already the safety
# net; this is what makes it automatic.
#
# The JDK is provisioned here rather than assumed. A workflow that relied on
# whatever Java the runner happened to ship would break the first time GitHub
# changed the image, and would not be reproducing what developers actually build
# with - the project needs 25.

name: build

on:
  push:
    branches: [main, dev2]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend - 48 tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Temurin 25, matching the JDK the project is developed against. `cache:
      # maven` keeps ~/.m2 between runs, which is the difference between a
      # two-minute job and a five-minute one.
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      # There is no `chmod +x mvnw` step here, and that is deliberate.
      #
      # The first run of this workflow failed with "./mvnw: Permission denied"
      # (exit 126), because the wrapper was committed as mode 100644. It was
      # checked in from Windows, where core.filemode is false and git cannot see
      # the Unix executable bit, so it had never been executable for anybody
      # cloning on Linux or macOS - the defect simply had no way to show itself
      # until something ran it on Ubuntu.
      #
      # The fix belongs in the repository, not here: the mode was corrected to
      # 100755 with `git update-index --chmod=+x backend/mvnw`. A chmod step in
      # CI would have made this job pass while leaving every Linux and macOS
      # clone with a wrapper it still could not run. Invoking `sh mvnw` would
      # hide it just as effectively.
      - name: Run the test suite
        working-directory: backend
        run: ./mvnw --batch-mode test

      # A separate step so a compilation failure in packaging is distinguishable
      # from a test failure above it, rather than both reading as "build failed".
      - name: Package
        working-directory: backend
        run: ./mvnw --batch-mode --no-transfer-progress package -DskipTests

  frontend:
    name: Frontend - type-check and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # node-version is the Node the BUILD runs on, which is unrelated to the
      # Node the action itself runs on - the v4 actions were pinned to Node 20
      # and the runner had begun forcing them onto 24, which is what the
      # deprecation warnings on the first run were about. Bumping the action
      # majors resolves that; 20 is still the right build target.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/tracker-ui/package-lock.json

      # `npm ci` rather than `npm install`: it installs exactly what the lock
      # file pins and fails if package.json and the lock have drifted apart,
      # which is what you want in CI and not what you want at a desk.
      - name: Install dependencies
        working-directory: frontend/tracker-ui
        run: npm ci

      # The editor and the build have disagreed before - see the typescript.tsdk
      # note in .vscode/settings.json. This runs the project's own compiler, so
      # the answer here is the one that counts.
      - name: Type-check
        working-directory: frontend/tracker-ui
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Build
        working-directory: frontend/tracker-ui
        run: npm run build
